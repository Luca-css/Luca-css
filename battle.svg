<!--  ROBOT  (pixel art, 8px grid) -->
<!-- ═══════════════════════════════ -->
<!-- Robot sits at x=200, feet at y=110 -->
<g class="robot">
  <g class="bobY">
    <!-- HEAD -->
    <rect x="190" y="42" width="28" height="20" fill="#44aaff" rx="2"/>
    <!-- Visor -->
    <rect x="194" y="46" width="20" height="8"  fill="#001830"/>
    <!-- Visor glow -->
    <rect x="196" y="48" width="6"  height="4"  fill="#00ffff" opacity=".9"/>
    <rect x="206" y="48" width="6"  height="4"  fill="#00ffff" opacity=".9"/>
    <!-- Head antenna -->
    <rect x="202" y="36" width="4"  height="6"  fill="#44aaff"/>
    <rect x="200" y="34" width="8"  height="4"  fill="#ff4444"/>

    <!-- TORSO -->
    <rect x="186" y="62" width="36" height="26" fill="#2288dd" rx="1"/>
    <!-- Chest panel -->
    <rect x="190" y="65" width="28" height="12" fill="#003366"/>
    <rect x="192" y="67" width="6"  height="4"  fill="#00ffff" opacity=".7"/>
    <rect x="200" y="67" width="4"  height="4"  fill="#ff4444" opacity=".8"/>
    <rect x="206" y="67" width="6"  height="4"  fill="#ffff00" opacity=".7"/>
    <!-- Shoulder pads -->
    <rect x="178" y="62" width="10" height="10" fill="#1166bb" rx="1"/>
    <rect x="220" y="62" width="10" height="10" fill="#1166bb" rx="1"/>

    <!-- ARM LEFT (swings) -->
