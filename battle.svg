<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020c1b"/>
    <stop offset="100%" stop-color="#071628"/>
  </linearGradient>
  <filter id="mg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="fg"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    @keyframes bolt{0%{transform:translateX(0);opacity:1}75%{transform:translateX(530px);opacity:1}76%{transform:translateX(530px);opacity:0}100%{transform:translateX(0);opacity:0}}
    @keyframes fire{0%{transform:translateX(0);opacity:1}70%{transform:translateX(-480px);opacity:1}71%{transform:translateX(-480px);opacity:0}100%{transform:translateX(0);opacity:0}}
    @keyframes orb{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes wing{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes hit{0%,74%{opacity:0}75%,83%{opacity:1}84%,100%{opacity:0}}
    @keyframes fhit{0%,69%{opacity:0}70%,79%{opacity:1}80%,100%{opacity:0}}
    @keyframes eyeglow{0%,100%{opacity:.15}50%{opacity:.55}}
    .bolt{animation:bolt 2.2s linear infinite}
    .fire{animation:fire 3s linear infinite 1.1s}
    .orb{animation:orb 1.4s ease-in-out infinite}
    .mage{animation:flt 3s ease-in-out infinite}
    .wg{animation:wing 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
    .hit{animation:hit 2.2s linear infinite}
    .fhit{animation:fhit 3s linear infinite 1.1s}
    .eg{animation:eyeglow 1.5s ease-in-out infinite}
  </style>
</defs>
