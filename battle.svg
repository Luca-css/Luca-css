<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 130" width="890" height="130">
<defs>
  <style>
    @keyframes scroll { from{transform:translateX(0)} to{transform:translateX(-445px)} }
    @keyframes scrollFast { from{transform:translateX(0)} to{transform:translateX(-890px)} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    /* robot run: legs alternate */
    @keyframes legL { 0%,100%{transform:rotate(-30deg)} 50%{transform:rotate(30deg)} }
    @keyframes legR { 0%,100%{transform:rotate(30deg)}  50%{transform:rotate(-30deg)} }
    @keyframes armL { 0%,100%{transform:rotate(25deg)}  50%{transform:rotate(-25deg)} }
    @keyframes armR { 0%,100%{transform:rotate(-25deg)} 50%{transform:rotate(25deg)} }
    @keyframes bobY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    /* transform sequence: robot visible 0-65%, flash 65-75%, car visible 75-100% */
    @keyframes showRobot { 0%,64%{opacity:1;transform:translateX(0)} 65%,66%{opacity:0} 67%,68%{opacity:1} 69%,100%{opacity:0} }
    @keyframes showCar   { 0%,64%{opacity:0} 65%,66%{opacity:1} 67%,68%{opacity:0} 69%,100%{opacity:1} }
    @keyframes flash     { 0%,63%{opacity:0} 64%,70%{opacity:1} 71%,100%{opacity:0} }
    .bg-city  { animation: scroll 8s linear infinite; }
    .bg-far   { animation: scroll 16s linear infinite; }
    .ground   { animation: scrollFast 3s linear infinite; }
    .blink    { animation: blink 0.8s step-end infinite; }
    .robot    { animation: showRobot 6s steps(1,end) infinite; }
    .car      { animation: showCar   6s steps(1,end) infinite; }
    .flash    { animation: flash     6s steps(1,end) infinite; }
    .bobY     { animation: bobY .25s steps(1,end) infinite; transform-box:fill-box; transform-origin:bottom center; }
    .legL     { animation: legL .25s steps(1,end) infinite; transform-box:fill-box; transform-origin:top center; }
    .legR     { animation: legR .25s steps(1,end) infinite; transform-box:fill-box; transform-origin:top center; }
    .armL     { animation: armL .25s steps(1,end) infinite; transform-box:fill-box; transform-origin:top center; }
    .armR     { animation: armR .25s steps(1,end) infinite; transform-box:fill-box; transform-origin:top center; }
  </style>
</defs>

