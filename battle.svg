      <rect x="173" y="72" width="8" height="18" fill="#2288dd" rx="1"/>
      <rect x="171" y="88" width="10" height="8"  fill="#1166bb" rx="1"/>
    </g>
    <!-- ARM RIGHT -->
    <g class="armR">
      <rect x="227" y="72" width="8" height="18" fill="#2288dd" rx="1"/>
      <rect x="227" y="88" width="10" height="8"  fill="#1166bb" rx="1"/>
    </g>

    <!-- HIPS -->
    <rect x="189" y="88" width="30" height="8" fill="#1166bb" rx="1"/>

    <!-- LEG LEFT -->
    <g class="legL">
      <rect x="189" y="96" width="12" height="16" fill="#2288dd" rx="1"/>
      <!-- Foot -->
      <rect x="187" y="108" width="16" height="6"  fill="#1166bb" rx="1"/>
    </g>
    <!-- LEG RIGHT -->
    <g class="legR">
      <rect x="207" y="96" width="12" height="16" fill="#2288dd" rx="1"/>
      <rect x="205" y="108" width="16" height="6"  fill="#1166bb" rx="1"/>
    </g>
  </g>
</g>

