<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Animação: um mago-hacker canaliza energia por um círculo mágico com um chip no centro até um servidor, enquanto um terminal executa o feitiço">
  <title>Arcane Terminal</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03111f"/>
      <stop offset="1" stop-color="#020812"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#7ee8ff"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0a2a4a" stroke-width="0.6"/>
    </pattern>
    <path id="runeRing" d="M405,140 a95,95 0 1,1 190,0 a95,95 0 1,1 -190,0"/>
    <path id="wireA" d="M205,66 H290 L320,96 H360 L380,140 H405"/>
    <path id="wireB" d="M595,140 H640 L665,110 H700 L715,125 H738"/>

    <clipPath id="t1"><rect x="826" y="96" height="16" width="170"><animate attributeName="width" values="0;0;170;170;0" keyTimes="0;0.05;0.18;0.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="826" y="116" height="16" width="170"><animate attributeName="width" values="0;0;170;170;0" keyTimes="0;0.22;0.32;0.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="826" y="136" height="16" width="170"><animate attributeName="width" values="0;0;170;170;0" keyTimes="0;0.36;0.46;0.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t4"><rect x="826" y="156" height="16" width="170"><animate attributeName="width" values="0;0;170;170;0" keyTimes="0;0.50;0.60;0.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t5"><rect x="826" y="176" height="16" width="170"><animate attributeName="width" values="0;0;170;170;0" keyTimes="0;0.64;0.70;0.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- background -->
  <rect width="1000" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)" opacity="0.55"/>

  <!-- stars -->
  <g fill="#7ecfff">
    <circle cx="60" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="22" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="250" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="28" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="252" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="40" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="220" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating glyphs -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#00d4ff">
    <text x="250" y="230">1<animateTransform attributeName="transform" type="translate" values="0 0;0 -160" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></text>
    <text x="330" y="250">✦<animateTransform attributeName="transform" type="translate" values="0 0;0 -170" dur="9s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="-1s" repeatCount="indefinite"/></text>
    <text x="440" y="270">0<animateTransform attributeName="transform" type="translate" values="0 0;0 -180" dur="8s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="-2s" repeatCount="indefinite"/></text>
    <text x="560" y="265">λ<animateTransform attributeName="transform" type="translate" values="0 0;0 -175" dur="7.5s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="-0.5s" repeatCount="indefinite"/></text>
    <text x="650" y="255">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 -165" dur="8.5s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8.5s" begin="-3s" repeatCount="indefinite"/></text>
    <text x="80" y="260">0x1F<animateTransform attributeName="transform" type="translate" values="0 0;0 -150" dur="9.5s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="9.5s" begin="-2.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- circuit wires -->
  <g fill="none" stroke="#0a4a6a" stroke-width="2">
    <use href="#wireA"/>
    <use href="#wireB"/>
  </g>
  <g fill="#00d4ff">
    <circle cx="290" cy="66" r="3"/><circle cx="360" cy="96" r="3"/>
    <circle cx="640" cy="140" r="3"/><circle cx="700" cy="110" r="3"/>
  </g>

  <!-- energy particles -->
  <g fill="url(#orb)" filter="url(#glow)">
    <circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#wireA"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite"><mpath href="#wireA"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite"><mpath href="#wireA"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2s" begin="-0.4s" repeatCount="indefinite"><mpath href="#wireB"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#wireB"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2s" begin="-1.7s" repeatCount="indefinite"><mpath href="#wireB"/></animateMotion></circle>
  </g>

  <!-- ===== tech-mage ===== -->
  <g>
    <ellipse cx="155" cy="242" rx="70" ry="8" fill="url(#aura)"/>
    <!-- robe -->
    <path d="M132,112 Q118,170 104,240 H206 Q192,170 178,112 Q155,126 132,112 Z" fill="#0b1e33" stroke="#0a4a6a" stroke-width="1.5"/>
    <!-- circuit trim on robe -->
    <path d="M155,126 V170 L140,185 V238 M155,170 L170,185 V238 M120,225 H190" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="140" cy="185" r="2" fill="#00d4ff"/><circle cx="170" cy="185" r="2" fill="#00d4ff"/>
    <!-- hood -->
    <path d="M130,118 Q127,76 155,66 Q183,76 180,118 Q168,102 155,102 Q142,102 130,118 Z" fill="#0d2540" stroke="#0a4a6a" stroke-width="1.5"/>
    <ellipse cx="155" cy="104" rx="15" ry="11" fill="#010509"/>
    <!-- eyes -->
    <g fill="#00d4ff" filter="url(#glow)">
      <rect x="146" y="101" width="6" height="2.5" rx="1"><animate attributeName="height" values="2.5;2.5;0.3;2.5;2.5" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="158" y="101" width="6" height="2.5" rx="1"><animate attributeName="height" values="2.5;2.5;0.3;2.5;2.5" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/></rect>
    </g>
    <!-- arm + staff -->
    <path d="M174,124 Q188,136 201,130" fill="none" stroke="#0d2540" stroke-width="7" stroke-linecap="round"/>
    <line x1="205" y1="76" x2="205" y2="242" stroke="#3a5a78" stroke-width="4" stroke-linecap="round"/>
    <path d="M197,82 L205,70 L213,82" fill="none" stroke="#3a5a78" stroke-width="3"/>
    <circle cx="201" cy="130" r="5" fill="#16324f"/>
    <!-- staff orb -->
    <circle cx="205" cy="66" r="22" fill="url(#aura)"><animate attributeName="r" values="18;26;18" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="66" r="9" fill="url(#orb)" filter="url(#glow)"><animate attributeName="r" values="8;10.5;8" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== magic circle with chip core ===== -->
  <g>
    <circle cx="500" cy="140" r="120" fill="url(#aura)"/>
    <!-- shockwave -->
    <circle cx="500" cy="140" r="40" fill="none" stroke="#00d4ff" stroke-width="1.5">
      <animate attributeName="r" values="40;118" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 500 140" to="360 500 140" dur="40s" repeatCount="indefinite"/>
      <circle cx="500" cy="140" r="108" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.85"/>
      <circle cx="500" cy="140" r="82" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
      <text font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#7ecfff" letter-spacing="0.6">
        <textPath href="#runeRing">✦ 01001100 ✦ &lt;spell/&gt; ✦ sudo cast ✦ 0xC0DE ✦ λ ✦ 01010011 ✦ { mana } ✦ init() ✦</textPath>
      </text>
    </g>
    <g stroke="#00d4ff" stroke-width="1.2" fill="none" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360 500 140" to="0 500 140" dur="24s" repeatCount="indefinite"/>
      <circle cx="500" cy="140" r="64" stroke-dasharray="4 6"/>
      <polygon points="500,80 552,170 448,170"/>
      <polygon points="500,200 448,110 552,110"/>
      <circle cx="500" cy="80" r="4" fill="#00d4ff"/>
      <circle cx="500" cy="200" r="4" fill="#00d4ff"/>
      <circle cx="448" cy="110" r="3" fill="#00d4ff"/><circle cx="552" cy="110" r="3" fill="#00d4ff"/>
      <circle cx="448" cy="170" r="3" fill="#00d4ff"/><circle cx="552" cy="170" r="3" fill="#00d4ff"/>
    </g>
    <!-- chip core -->
    <g>
      <g stroke="#7ecfff" stroke-width="2">
        <line x1="489" y1="114" x2="489" y2="120"/><line x1="500" y1="114" x2="500" y2="120"/><line x1="511" y1="114" x2="511" y2="120"/>
        <line x1="489" y1="160" x2="489" y2="166"/><line x1="500" y1="160" x2="500" y2="166"/><line x1="511" y1="160" x2="511" y2="166"/>
        <line x1="474" y1="129" x2="480" y2="129"/><line x1="474" y1="140" x2="480" y2="140"/><line x1="474" y1="151" x2="480" y2="151"/>
        <line x1="520" y1="129" x2="526" y2="129"/><line x1="520" y1="140" x2="526" y2="140"/><line x1="520" y1="151" x2="526" y2="151"/>
      </g>
      <rect x="480" y="120" width="40" height="40" rx="5" fill="#04182b" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>
      <rect x="490" y="130" width="20" height="20" rx="2" fill="#00d4ff">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ===== server rack ===== -->
  <g>
    <rect x="738" y="62" width="70" height="170" rx="6" fill="#06192c" stroke="#0a4a6a" stroke-width="2"/>
    <g fill="#0b2238" stroke="#0a4a6a">
      <rect x="746" y="72" width="54" height="24" rx="3"/>
      <rect x="746" y="102" width="54" height="24" rx="3"/>
      <rect x="746" y="132" width="54" height="24" rx="3"/>
      <rect x="746" y="162" width="54" height="24" rx="3"/>
      <rect x="746" y="192" width="54" height="24" rx="3"/>
    </g>
    <g stroke="#0a4a6a" stroke-width="1.5">
      <line x1="772" y1="84" x2="792" y2="84"/><line x1="772" y1="114" x2="792" y2="114"/>
      <line x1="772" y1="144" x2="792" y2="144"/><line x1="772" y1="174" x2="792" y2="174"/><line x1="772" y1="204" x2="792" y2="204"/>
    </g>
    <g>
      <circle cx="755" cy="84" r="3" fill="#00d4ff"><animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="763" cy="84" r="3" fill="#2ee59d"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="755" cy="114" r="3" fill="#00d4ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="763" cy="114" r="3" fill="#2ee59d"><animate attributeName="opacity" values="1;0.4;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="755" cy="144" r="3" fill="#00d4ff"><animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="763" cy="144" r="3" fill="#2ee59d"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="755" cy="174" r="3" fill="#00d4ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="763" cy="174" r="3" fill="#2ee59d"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="755" cy="204" r="3" fill="#00d4ff"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="763" cy="204" r="3" fill="#2ee59d"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- ===== terminal ===== -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11">
    <rect x="818" y="62" width="168" height="170" rx="8" fill="#010a14" stroke="#0a4a6a" stroke-width="2"/>
    <rect x="818" y="62" width="168" height="20" rx="8" fill="#0a2a4a"/>
    <rect x="818" y="74" width="168" height="8" fill="#0a2a4a"/>
    <circle cx="831" cy="72" r="3.5" fill="#ff5f56"/><circle cx="843" cy="72" r="3.5" fill="#ffbd2e"/><circle cx="855" cy="72" r="3.5" fill="#27c93f"/>
    <text x="902" y="76" fill="#7ecfff" font-size="9" text-anchor="middle">arcane@sh</text>

    <text x="828" y="108" fill="#00d4ff" clip-path="url(#t1)">$ ./cast --deploy</text>
    <text x="828" y="128" fill="#7ecfff" clip-path="url(#t2)">› runes compiled  <tspan fill="#2ee59d">✓</tspan></text>
    <text x="828" y="148" fill="#7ecfff" clip-path="url(#t3)">› shield: firewall <tspan fill="#2ee59d">✓</tspan></text>
    <text x="828" y="168" fill="#7ecfff" clip-path="url(#t4)">› daemon summoned <tspan fill="#2ee59d">✓</tspan></text>
    <text x="828" y="188" fill="#00d4ff" clip-path="url(#t5)">$</text>
    <rect x="840" y="179" width="7" height="12" fill="#00d4ff">
      <animate attributeName="opacity" values="0;0;1;0;1;0;1;0" keyTimes="0;0.69;0.72;0.78;0.84;0.9;0.95;1" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- caption -->
  <text x="500" y="268" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#3a6a8a" letter-spacing="2">// onde magia encontra código</text>
</svg>
